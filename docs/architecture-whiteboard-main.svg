<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">cruush Architecture Whiteboard</title>
  <desc id="desc">Rendered architecture diagram showing Browser, Vite frontend, Fastify API, and Postgres database layers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .cluster { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .cluster-title { font: 700 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .node { stroke-width: 2; rx: 12; }
      .node-text { font: 600 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .browser { fill: #fef3c7; stroke: #f59e0b; }
      .frontend { fill: #dbeafe; stroke: #2563eb; }
      .api { fill: #ede9fe; stroke: #7c3aed; }
      .db { fill: #dcfce7; stroke: #16a34a; }
      .edge { fill: none; stroke: #263238; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-soft { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); stroke-dasharray: 7 6; }
      .label { font: 600 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1600" height="1600"/>

  <text x="80" y="68" style="font: 800 34px Inter, ui-sans-serif, system-ui; fill: #0f172a;">cruush Architecture Whiteboard</text>
  <text x="80" y="96" style="font: 500 16px Inter, ui-sans-serif, system-ui; fill: #475569;">Vite React client -> Fastify API -> Postgres, with app-owned session auth and profile privacy controls.</text>

  <rect class="cluster" x="70" y="135" width="320" height="690"/>
  <text class="cluster-title" x="100" y="175">Browser</text>

  <rect class="node browser" x="105" y="215" width="250" height="72"/>
  <text class="node-text" x="230" y="246" text-anchor="middle">React app</text>
  <text class="small" x="230" y="269" text-anchor="middle">src/app/App.tsx</text>

  <rect class="node browser" x="105" y="325" width="250" height="92"/>
  <text class="node-text" x="230" y="356" text-anchor="middle">Screens</text>
  <text class="small" x="230" y="379" text-anchor="middle">Map, Feed, Profiles</text>
  <text class="small" x="230" y="400" text-anchor="middle">Messages, cruush, Settings</text>

  <rect class="node browser" x="105" y="455" width="250" height="72"/>
  <text class="node-text" x="230" y="486" text-anchor="middle">API wrappers</text>
  <text class="small" x="230" y="509" text-anchor="middle">src/app/lib/*Api.ts</text>

  <rect class="node browser" x="105" y="565" width="250" height="82"/>
  <text class="node-text" x="230" y="596" text-anchor="middle">MapLibre UI</text>
  <text class="small" x="230" y="619" text-anchor="middle">OpenFreeMap / CARTO tiles</text>

  <rect class="node browser" x="105" y="685" width="250" height="82"/>
  <text class="node-text" x="230" y="716" text-anchor="middle">Local browser state</text>
  <text class="small" x="230" y="739" text-anchor="middle">session cache + preview URLs</text>

  <rect class="cluster" x="455" y="135" width="300" height="690"/>
  <text class="cluster-title" x="485" y="175">Vite Frontend</text>

  <rect class="node frontend" x="490" y="240" width="230" height="82"/>
  <text class="node-text" x="605" y="271" text-anchor="middle">Vite dev server</text>
  <text class="small" x="605" y="294" text-anchor="middle">localhost:5173</text>

  <rect class="node frontend" x="490" y="405" width="230" height="82"/>
  <text class="node-text" x="605" y="436" text-anchor="middle">/api + /health proxy</text>
  <text class="small" x="605" y="459" text-anchor="middle">vite.config.ts</text>

  <rect class="node frontend" x="490" y="570" width="230" height="82"/>
  <text class="node-text" x="605" y="601" text-anchor="middle">Figma asset resolver</text>
  <text class="small" x="605" y="624" text-anchor="middle">src/assets</text>

  <rect class="cluster" x="820" y="135" width="390" height="690"/>
  <text class="cluster-title" x="850" y="175">Fastify API</text>

  <rect class="node api" x="865" y="205" width="300" height="68"/>
  <text class="node-text" x="1015" y="234" text-anchor="middle">buildServer()</text>
  <text class="small" x="1015" y="256" text-anchor="middle">server/src/app.ts</text>

  <rect class="node api" x="865" y="305" width="138" height="66"/>
  <text class="node-text" x="934" y="334" text-anchor="middle">CORS</text>
  <text class="small" x="934" y="356" text-anchor="middle">allowlist</text>

  <rect class="node api" x="1027" y="305" width="138" height="66"/>
  <text class="node-text" x="1096" y="334" text-anchor="middle">Errors</text>
  <text class="small" x="1096" y="356" text-anchor="middle">formatter</text>

  <rect class="node api" x="865" y="405" width="300" height="66"/>
  <text class="node-text" x="1015" y="434" text-anchor="middle">Postgres rate limiter</text>
  <text class="small" x="1015" y="456" text-anchor="middle">server/src/rate-limit.ts</text>

  <rect class="node api" x="855" y="505" width="145" height="64"/>
  <text class="node-text" x="927" y="535" text-anchor="middle">Auth routes</text>
  <text class="small" x="927" y="557" text-anchor="middle">auth.ts</text>

  <rect class="node api" x="1030" y="505" width="145" height="64"/>
  <text class="node-text" x="1102" y="535" text-anchor="middle">Profiles</text>
  <text class="small" x="1102" y="557" text-anchor="middle">profiles.ts</text>

  <rect class="node api" x="855" y="595" width="145" height="64"/>
  <text class="node-text" x="927" y="625" text-anchor="middle">Discovery</text>
  <text class="small" x="927" y="647" text-anchor="middle">users.ts</text>

  <rect class="node api" x="1030" y="595" width="145" height="64"/>
  <text class="node-text" x="1102" y="625" text-anchor="middle">Messages</text>
  <text class="small" x="1102" y="647" text-anchor="middle">messages.ts</text>

  <rect class="node api" x="855" y="685" width="145" height="64"/>
  <text class="node-text" x="927" y="715" text-anchor="middle">Posts</text>
  <text class="small" x="927" y="737" text-anchor="middle">posts.ts</text>

  <rect class="node api" x="1030" y="685" width="145" height="64"/>
  <text class="node-text" x="1102" y="715" text-anchor="middle">cruush</text>
  <text class="small" x="1102" y="737" text-anchor="middle">cruush.ts</text>

  <rect class="node api" x="875" y="780" width="280" height="64"/>
  <text class="node-text" x="1015" y="810" text-anchor="middle">Zod schemas + privacy services</text>
  <text class="small" x="1015" y="832" text-anchor="middle">input, mailer, turnstile, encryption</text>

  <rect class="cluster" x="1270" y="135" width="260" height="690"/>
  <text class="cluster-title" x="1300" y="175">Postgres</text>

  <rect class="node db" x="1300" y="220" width="200" height="62"/>
  <text class="node-text" x="1400" y="258" text-anchor="middle">app_users</text>

  <rect class="node db" x="1300" y="315" width="200" height="62"/>
  <text class="node-text" x="1400" y="353" text-anchor="middle">app_sessions</text>

  <rect class="node db" x="1300" y="410" width="200" height="62"/>
  <text class="node-text" x="1400" y="448" text-anchor="middle">profiles</text>

  <rect class="node db" x="1300" y="505" width="200" height="84"/>
  <text class="node-text" x="1400" y="536" text-anchor="middle">token tables</text>
  <text class="small" x="1400" y="559" text-anchor="middle">verification, reset,</text>
  <text class="small" x="1400" y="580" text-anchor="middle">sensitive, rate limits</text>

  <rect class="node db" x="1300" y="625" width="200" height="100"/>
  <text class="node-text" x="1400" y="656" text-anchor="middle">social content</text>
  <text class="small" x="1400" y="679" text-anchor="middle">posts, cruushes,</text>
  <text class="small" x="1400" y="700" text-anchor="middle">conversations, messages</text>

  <rect class="node db" x="1300" y="760" width="200" height="62"/>
  <text class="node-text" x="1400" y="798" text-anchor="middle">kink catalog</text>

  <path class="edge" d="M230 287 L230 325"/>
  <path class="edge" d="M230 417 L230 455"/>
  <path class="edge" d="M355 491 C410 491 430 281 490 281"/>
  <path class="edge" d="M720 281 C770 281 805 239 865 239"/>
  <path class="edge" d="M605 322 L605 405"/>
  <path class="edge" d="M720 446 C780 446 803 438 865 438"/>
  <path class="edge" d="M355 371 C430 371 410 611 490 611"/>
  <path class="edge-soft" d="M355 606 C540 606 665 626 855 626"/>

  <path class="edge" d="M1015 273 L1015 305"/>
  <path class="edge" d="M1015 273 C960 285 934 292 934 305"/>
  <path class="edge" d="M1015 273 C1070 285 1096 292 1096 305"/>
  <path class="edge" d="M1015 371 L1015 405"/>
  <path class="edge" d="M1015 471 C970 484 927 488 927 505"/>
  <path class="edge" d="M1015 471 C1060 484 1102 488 1102 505"/>
  <path class="edge" d="M927 569 L927 595"/>
  <path class="edge" d="M1102 569 L1102 595"/>
  <path class="edge" d="M927 659 L927 685"/>
  <path class="edge" d="M1102 659 L1102 685"/>
  <path class="edge" d="M1015 749 L1015 780"/>

  <path class="edge" d="M1165 239 C1225 239 1245 251 1300 251"/>
  <path class="edge" d="M927 569 C1220 570 1230 251 1300 251"/>
  <path class="edge" d="M927 569 C1220 585 1230 346 1300 346"/>
  <path class="edge" d="M1102 569 C1220 570 1230 441 1300 441"/>
  <path class="edge" d="M1015 438 C1240 438 1230 547 1300 547"/>
  <path class="edge" d="M927 717 C1210 717 1230 675 1300 675"/>
  <path class="edge" d="M1102 627 C1220 627 1230 675 1300 675"/>
  <path class="edge" d="M1102 717 C1220 717 1230 675 1300 675"/>
  <path class="edge" d="M1102 569 C1230 570 1230 791 1300 791"/>

  <text class="label" x="395" y="476">requestApi()</text>
  <text class="label" x="745" y="420">proxy / API calls</text>
  <text class="label" x="1215" y="220">queries</text>
</svg>
