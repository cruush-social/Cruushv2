# Indexing is decided per path, and denied by default, so that a route added
# later is out of every index until someone deliberately allows it. The opposite
# default would silently expose each new surface.
#
# This keys on $request_uri, not $uri: the SPA fallback rewrites $uri to
# /index.html for every route, so keying on $uri would mark /map, /messages and
# every other member surface indexable.
map $request_uri $cruush_robots_tag {
  default            "noindex, nofollow, noarchive, nosnippet, noimageindex";
  "~^/(\?.*)?$"      "index, follow";
  "~^/robots\.txt$"  "all";
  "~^/sitemap\.xml$" "all";
  "~^/llms\\.txt$"    "all";
  "~^/about/?(\\?.*)?$" "index, follow";
  "~^/help/?(\\?.*)?$"  "index, follow";
  "~^/blog/?(\\?.*)?$"  "index, follow";
  "~^/blog/safety-on-cruush\\.html(\\?.*)?$" "index, follow";
  "~^/blog/crypto-first\\.html(\\?.*)?$" "index, follow";
}

# Paths can also contain capability tokens. The API logs route templates;
# the static server needs only method, protocol, status and timing.
log_format cruush_safe '$remote_addr [$time_local] "$request_method $server_protocol" '
                       '$status $body_bytes_sent $request_time';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Default access/error formats can expose auth URLs, Referer and other headers.
  access_log /var/log/nginx/access.log cruush_safe;
  # nginx request errors have no configurable format to remove secret URLs.
  # Keep startup/configuration diagnostics in the parent nginx error log.
  error_log /dev/null;

  if ($host = "www.cruush.app") {
    return 301 https://cruush.app$request_uri;
  }

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-hUv2wJRMSnXf9DBj0nnA99ssUaSEIsl8deLIFGK7p84=' 'sha256-MvnqcPpOuuaHki/akqho7O9cRxdAZwRE/3TUiPuCpdA=' 'sha256-cXHgi6p7d7htad5uhzUi+DCkzMfyDAGg0F+bDfYkaWI=' 'sha256-6s6d6p5q5VoKpnmWLoMOO31kAFDHowA0u6+9pMZfuyM=' 'sha256-PlKjoqNPGbhHJG3D1Dsz+jJewQMdcs3E3n6ZRyrVZe0=' 'sha256-WC/mOZUX+1TllYfMpnhzQcNI5Ej0ND8I9J4X/ZFyOdY=' 'sha256-xBCRGAtYTvVWeWrr+W5GGqeqZYLhF5FE2m9o7vmBoLQ=' https://*.posthog.com https://challenges.cloudflare.com https://www.googletagmanager.com; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://*.posthog.com https://api.cruush.app https://api-staging.cruush.app https://tiles.openfreemap.org https://*.basemaps.cartocdn.com https://challenges.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; frame-src https://challenges.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Robots-Tag $cruush_robots_tag always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  add_header Pragma "no-cache" always;

  location = /index.html {
    expires -1;
  }

  location = /sw.js {
    expires -1;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  # An add_header here replaces every add_header inherited from the server block,
  # so the security headers above must be repeated for asset responses.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri =404;
  }

  # Static documents served outside the application. They are plain HTML so that
  # a crawler which runs no JavaScript can read them, which is the whole reason
  # they are not React routes. Declared before the extension rule below so they
  # match first.
  location ~ ^/about/?$ {
    try_files /about.html =404;
  }

  location ~ ^/help/?$ {
    try_files /help.html =404;
  }

  location ~ ^/blog/?$ {
    try_files /blog/index.html =404;
  }

  location = /blog/safety-on-cruush.html {
    try_files /blog/safety-on-cruush.html =404;
  }

  location = /blog/crypto-first.html {
    try_files /blog/crypto-first.html =404;
  }

  # A missing build file must 404 rather than fall through to index.html, which
  # would answer a script or stylesheet request with HTML.
  location ~* \.(?:js|mjs|css|json|webmanifest|map)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
