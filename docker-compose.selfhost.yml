services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cruush
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./server
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cruush
      CORS_ORIGIN: http://localhost:5173
      SESSION_SECRET: local-dev-secret
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - postgres

volumes:
  postgres_data:
